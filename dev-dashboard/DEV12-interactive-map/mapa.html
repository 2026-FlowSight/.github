<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>FlowSight · Mapa Pezinka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@87.5..100,400..700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css?v=20261116j">
<link rel="stylesheet" href="map.css?v=20261116j">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script defer src="data/cameras.js?v=20261116j"></script>
<script defer src="data/pezinok-layers.js?v=20261116j"></script>
<script defer src="map.js?v=20261116j"></script>
</head>
<body class="map-page">
<svg class="icon-library" aria-hidden="true"><defs>
 <symbol id="i-camera" viewBox="0 0 24 24"><path d="M3 8.5h11v8H3z"/><path d="m14 11 6-3v9l-6-3"/><path d="M6 16.5 5 20m6-3.5 1 3.5"/></symbol>
 <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol>
 <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></symbol>
</defs></svg>

<header class="appbar">
 <a class="brand" href="../DEV13-db-search-frontend/index.html" aria-label="FlowSight Pezinok">
  <svg class="brand-mark" viewBox="0 0 32 36" aria-hidden="true"><path d="M3 3h26v15c0 8-6 13.5-13 15C9 31.5 3 26 3 18Z"/><circle cx="16" cy="16" r="5.2"/><circle cx="16" cy="16" r="1.6"/></svg>
  <span class="brand-name">FlowSight</span><span class="brand-city">Pezinok</span>
 </a>
 <nav class="modules" aria-label="Moduly dashboardu">
  <a class="module is-current" href="mapa.html" aria-current="page">Mapa</a>
  <a class="module" href="../DEV13-db-search-frontend/udalosti.html">Udalosti</a>
  <span class="module" aria-disabled="true" title="Pripravuje sa">Štatistiky</span>
  <span class="module" aria-disabled="true" title="Pripravuje sa">Kamery</span>
  <a class="module" href="../DEV13-db-search-frontend/index.html">Vyhľadávanie</a>
 </nav>
 <span class="mode-pill" data-mode="pending" title="Zoznam kamier podľa Mestskej polície Pezinok (2024), polohy sú odhadnuté z OpenStreetMap. Živý obraz zatiaľ nie je pripojený."><i></i><span>41 mestských kamier</span></span>
</header>

<div class="map-layout">
 <aside class="map-side">
  <section class="panel side-block" aria-labelledby="layers-title">
   <h2 id="layers-title">Vrstvy na mape</h2>
   <div class="layer-list">
    <label class="layer"><input type="checkbox" data-layer="cameras" checked><span class="swatch swatch-camera"></span><span>Mestské kamery</span></label>
    <label class="layer"><input type="checkbox" data-layer="lots" checked><span class="swatch swatch-lot"></span><span>Odstavné plochy</span></label>
    <label class="layer"><input type="checkbox" data-layer="zones"><span class="swatch swatch-zone"></span><span>Parkovacie zóny</span></label>
    <label class="layer"><input type="checkbox" data-layer="boundary" checked><span class="swatch swatch-boundary"></span><span>Hranica mesta</span></label>
   </div>
  </section>

  <section class="panel side-block cams" aria-labelledby="cams-title">
   <div class="side-head"><h2 id="cams-title">Kamery</h2><span id="cam-count" class="count" role="status" aria-live="polite"></span></div>

   <label class="cam-search">
    <svg aria-hidden="true"><use href="#i-search"/></svg>
    <input id="cam-query" type="search" placeholder="Číslo kamery alebo ulica" aria-label="Hľadať kameru podľa čísla alebo ulice" autocomplete="off">
   </label>
   <div id="active-filters" class="active-filters" hidden></div>

   <fieldset class="facet">
    <legend>Typ</legend>
    <div class="segmented" id="facet-type"></div>
   </fieldset>

   <fieldset class="facet">
    <legend>Umiestnenie</legend>
    <div class="facet-options" id="facet-place"></div>
   </fieldset>

   <details class="facet facet-collapsible" id="facet-area-box">
    <summary><span>Časť mesta</span><span id="facet-area-summary" class="facet-summary">všetky</span></summary>
    <div class="facet-options" id="facet-area"></div>
   </details>

   <ul id="camera-list" class="camera-list"></ul>
   <div id="cam-empty" class="cam-empty" hidden>
    <p>Filtrom nevyhovuje žiadna kamera.</p>
    <button type="button" class="link-button" data-clear>Vymazať filtre</button>
   </div>
  </section>
 </aside>

 <section class="map-wrap panel" aria-label="Mapa mesta Pezinok">
  <div id="map" class="map"></div>
  <p id="map-error" class="map-error" role="alert" hidden>Mapový podklad sa nenačítal. Skontrolujte pripojenie na internet.</p>
 </section>
</div>
</body>
</html>
